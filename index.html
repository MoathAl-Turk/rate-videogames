<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <h2 id="logo">GameRater</h2>
    <div class="nav-right">
        <span id="user-name-display" style="display: none; margin-right: 15px; color: var(--primary); font-weight: bold;"></span>
        <button id="nav-settings-btn" style="display: none;">Settings</button>
        <button id="login-btn-nav">Log In</button>
    </div>
</nav>

<div class="container">
    
    <!-- VIEW 1: Home / Feed -->
    <div id="view-home">
        <div class="form-card" id="rate-prompt-card" style="display: none; text-align: center;">
            <h3 style="margin-top: 0;">Played a game recently?</h3>
            <button id="go-to-rate-btn">Rate a Game</button>
        </div>
        
        <div id="reviews-container"></div>
    </div>

    <!-- VIEW 2: Rate a Game Form -->
    <div id="view-rate" style="display: none;">
        <div class="form-card">
            <h2>Rate a Game</h2>
            <form id="review-form">
                
                <div class="autocomplete-wrapper" style="position: relative;">
                    <input type="text" id="game-name" placeholder="Search for a game... (e.g., Elden Ring)" required autocomplete="off">
                    <div id="autocomplete-list" class="autocomplete-items"></div>
                </div>

                <select id="game-rating" required>
                    <option value="" disabled selected>Select Rating</option>
                    <option value="5">5 - Masterpiece</option>
                    <option value="4">4 - Great</option>
                    <option value="3">3 - Good</option>
                    <option value="2">2 - Mediocre</option>
                    <option value="1">1 - Terrible</option>
                </select>
                <textarea id="game-review" rows="4" placeholder="Write your review here..." required></textarea>
                
                <label class="checkbox-label">
                    <input type="checkbox" id="post-anonymous">
                    Post Anonymously
                </label>

                <button type="submit">Submit Review</button>
                <button type="button" id="back-to-home-btn" class="secondary-btn">Cancel & Go Back</button>
            </form>
        </div>
    </div>

    <!-- VIEW 3: Settings -->
    <div id="view-settings" style="display: none;">
        <div class="form-card" style="text-align: center;">
            <h2 style="margin-top: 0;">Settings</h2>
            
            <h3 style="margin-top: 20px; color: var(--text);">OpenRouter API Key</h3>
            <p style="font-size: 0.85rem; color: #888;">Stored securely in your browser's local storage.</p>
            <input type="password" id="api-key-input" placeholder="sk-or-v1-..." style="text-align: center;">
            <button id="save-key-btn" class="secondary-btn" style="margin-bottom: 20px;">Save Key</button>

            <h3 style="margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; color: var(--text);">UI Theme</h3>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="default">Purple (Default)</button>
                <button class="theme-btn" data-theme="green">Matrix Green</button>
                <button class="theme-btn" data-theme="bw">High Contrast (B&W)</button>
            </div>

            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #333;">
                <button id="logout-btn-settings" class="delete-btn" style="width: 100%;">Log Out</button>
            </div>

            <p class="credits" style="margin-top: 30px; font-weight: bold; color: var(--primary);">Made By Moath Al-Turk</p>
            <button type="button" id="settings-back-btn" class="secondary-btn" style="margin-top: 15px;">Back to Feed</button>
        </div>
    </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
