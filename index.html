<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameRater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>GameRater</h1>
    
    <!-- Auth Section -->
    <div class="auth-card" id="auth-section">
        <button id="login-btn">Log in with Google to Rate Games</button>
        <div id="user-info" style="display: none;">
            <p>Logged in as: <span id="user-name-display" style="color: var(--primary); font-weight: bold;"></span></p>
            <button id="logout-btn" style="background-color: #ff5252;">Log Out</button>
        </div>
    </div>

    <!-- Review Form (Hidden by default for guests) -->
    <div class="form-card" id="form-container" style="display: none;">
        <h2>Rate a Game</h2>
        <form id="review-form">
            <input type="text" id="game-name" placeholder="Game Title (e.g., Elden Ring, Valorant)" required>
            <select id="game-rating" required>
                <option value="" disabled selected>Select Rating</option>
                <option value="5">5 - Masterpiece</option>
                <option value="4">4 - Great</option>
                <option value="3">3 - Good</option>
                <option value="2">2 - Mediocre</option>
                <option value="1">1 - Terrible</option>
            </select>
            <textarea id="game-review" rows="4" placeholder="Write your review here..." required></textarea>
            <button type="submit">Submit Review</button>
        </form>
    </div>

    <div id="reviews-container">
        <!-- Live reviews will render here -->
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
